<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>adan@portfolio</title>

    <!--
      Tells trunk to compile this crate to WASM and inject the loader.

      The data-wasm-opt-params flags are not optional. rustc enables these wasm
      features by default for wasm32-unknown-unknown, but trunk's bundled
      Binaryen validates against the MVP baseline and rejects the output with
      "memory.copy operations require bulk memory operations". Each flag below
      re-enables a feature rustc already emitted.
    -->
    <link
      data-trunk
      rel="rust"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-mutable-globals --enable-nontrapping-float-to-int --enable-sign-ext"
    />

    <!--
      No CDN font on purpose: this gets embedded in the Next.js site, and a
      remote stylesheet is one more thing that can fail or get blocked. The
      system monospace stack renders box-drawing characters correctly on
      Windows, macOS and Linux.
    -->
    <style>
      :root {
        --bg: #000000;
      }
      /*
        Cell geometry is pinned to exactly 10x20px. Do not "clean this up" into
        a plain font-size — the numbers are matched to the backend on purpose.

        Ratzilla's DomBackend measures one probe cell when it starts and then
        never again except on a resize event. Inside an iframe that measurement
        runs before layout settles, the probe comes back zero-sized, and it
        falls back to DEFAULT_CELL_SIZE = 10x20px (src/backend/dom.rs). It then
        divides the parent width by 10 to get the column count. With a real
        advance of 8.78px that produced ~122 columns of content inside a grid
        140 columns wide: the border closed early and a dead strip ran down the
        right-hand side.

        Forcing a resize to trigger the re-measure path was tried and is worse —
        it wipes the grid without repainting it, leaving the terminal blank.

        So instead the rendered cell is made to *be* 10x20px. Then the assumed
        geometry and the drawn geometry agree, and it no longer matters whether
        the probe succeeds: if it measures, it measures these same 10x20 cells.
        Robust in both directions, and independent of which monospace font the
        viewer's OS actually resolves.
      */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg);
        overflow: hidden;
        font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas,
          "DejaVu Sans Mono", monospace;
        font-size: 16px;
        line-height: 20px;
      }
      pre {
        /* Inherit the metrics above rather than restating them. */
        font: inherit;
        line-height: 20px;
        margin: 0;
        /* Let the TUI own the click target so keyboard focus behaves. */
        user-select: none;
      }
      /*
        Ratzilla sizes each cell inline as `width: 1ch`, which varies by font.
        Override it to the fixed 10px the backend assumes. !important is
        required: inline styles otherwise win. The 16px font above has an
        advance under 10px in every monospace face in the stack, so glyphs sit
        inside the cell with a little tracking rather than being clipped.
      */
      pre > span {
        width: 10px !important;
        line-height: 20px !important;
      }
    </style>
  </head>
  <body></body>
</html>
